{% extends 'base.html' %}
{% block title %}Messages — QuickChat{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-4 mb-3">
    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
      <h5 class="fw-bold text-primary mb-3">Conversations</h5>
      <div class="list-group list-group-flush">
        <a href="#" class="list-group-item list-group-item-action active rounded-3 mb-1">
          <div class="d-flex w-100 justify-content-between">
            <h6 class="mb-1 fw-bold">Alice</h6>
            <small>10:15 AM</small>
          </div>
          <small class="text-white-50">See you in QuickChat!</small>
        </a>
      </div>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white" style="min-height: 400px; display: flex; flex-direction: column;">
      <h6 class="fw-bold text-primary border-bottom pb-2">Chat with Alice</h6>
      <div class="flex-grow-1 my-3 overflow-auto">
        <div class="bg-light p-3 rounded-3 mb-2 w-75">Hello over WebSockets!</div>
        <div class="bg-primary text-white p-3 rounded-3 mb-2 w-75 ms-auto text-end">Got your message.</div>
      </div>
      <form class="d-flex gap-2">
        <input type="text" class="form-control" placeholder="Type a message...">
        <button class="btn btn-primary fw-bold" type="submit">Send</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
