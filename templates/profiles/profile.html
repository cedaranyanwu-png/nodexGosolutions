{% extends 'base.html' %}
{% block title %}Profile — QuickChat{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4 bg-white">
  <div class="bg-primary text-white p-5 text-center">
    <h2 class="fw-bold mb-1">User Profile</h2>
    <p class="mb-0">@quickchat_member</p>
  </div>
  <div class="card-body p-4">
    <h5 class="fw-bold text-primary">Bio</h5>
    <p class="text-secondary">Building social media software with Python, WebSockets, and WebRTC.</p>
    <div class="d-flex gap-4 border-top pt-3">
      <div><strong class="text-primary fs-5">120</strong> <small class="text-muted d-block">Followers</small></div>
      <div><strong class="text-primary fs-5">85</strong> <small class="text-muted d-block">Following</small></div>
    </div>
  </div>
</div>
{% endblock %}
