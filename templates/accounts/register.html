{% extends 'base.html' %}
{% block title %}Create Account — QuickChat{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
      <h3 class="fw-bold text-center text-primary mb-4">Create Your QuickChat Account</h3>
      <form id="registerForm" method="POST" action="/api/v1/accounts/register/">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label font-weight-semibold">Username</label>
          <input type="text" name="username" class="form-control form-control-lg" required placeholder="username">
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-semibold">Email Address</label>
          <input type="email" name="email" class="form-control form-control-lg" required placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-semibold">Account Mode</label>
          <select name="account_mode" class="form-select form-select-lg">
            <option value="personal">Personal</option>
            <option value="creator">Creator</option>
            <option value="professional">Professional</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label font-weight-semibold">Password</label>
          <input type="password" name="password" class="form-control form-control-lg" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Register Now</button>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">Already registered? <a href="/login/" class="text-primary fw-semibold">Sign In</a></small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
