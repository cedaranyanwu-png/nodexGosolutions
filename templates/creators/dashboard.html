{% extends 'base.html' %}
{% block title %}Creator Dashboard — QuickChat{% endblock %}

{% block content %}
<h2 class="fw-bold text-primary mb-4">Creator Hub & Analytics</h2>
<div class="row mb-4">
  <div class="col-md-3">
    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white text-center">
      <small class="text-muted">Total Reach</small>
      <h3 class="fw-bold text-primary my-1">45.2K</h3>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white text-center">
      <small class="text-muted">Impressions</small>
      <h3 class="fw-bold text-primary my-1">128.9K</h3>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white text-center">
      <small class="text-muted">Engagement Rate</small>
      <h3 class="fw-bold text-primary my-1">8.4%</h3>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white text-center">
      <small class="text-muted">Net Growth</small>
      <h3 class="fw-bold text-primary my-1">+1,240</h3>
    </div>
  </div>
</div>
{% endblock %}
