<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Link Generator</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="/css/generate_link.css" rel="stylesheet">

</head>
<body>

<div class="container">
  <div class="card wa-card">
    <div class="wa-header text-center">
      <h2><i class="fa-brands fa-whatsapp me-2"></i> WhatsApp Link Generator</h2>
      <p class="mb-0 text-white-50">Create direct click-to-chat links with custom pre-filled messages.</p>
    </div>

    <div class="card-body p-4">
      <form id="waForm" novalidate>
        <!-- Phone Input -->
        <div class="mb-3">
          <label for="phone" class="form-label fw-semibold">Phone Number (with Country Code)</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
            <input type="tel" class="form-control" id="phone" placeholder="e.g. 15551234567" required>
          </div>
          <div class="form-text">Enter number with country code, no <code>+</code> sign or spaces.</div>
        </div>

        <!-- Pre-filled Message -->
        <div class="mb-3">
          <label for="message" class="form-label fw-semibold">Pre-filled Message (Optional)</label>
          <textarea class="form-control" id="message" rows="3" placeholder="Hi! I'm interested in your services..."></textarea>
        </div>

        <!-- Live Preview -->
        <div class="mb-4">
          <label class="form-label fw-semibold text-muted small">LIVE PREVIEW</label>
          <div class="preview-box">
            <div class="chat-bubble">
              <span id="previewText" class="fst-italic text-muted">Your message preview will appear here...</span>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-whatsapp w-100 py-2 fs-5">
          <i class="fa-solid fa-link me-2"></i> Generate Link
        </button>
      </form>

      <!-- Output Section -->
      <div id="outputSection" class="mt-4 pt-4 border-top" style="display: none;">
        <label class="form-label fw-semibold">Your WhatsApp Link:</label>
        <div class="input-group mb-3">
          <input type="text" id="generatedLink" class="form-control" readonly>
          <button class="btn btn-outline-secondary" type="button" id="copyBtn">
            <i class="fa-solid fa-copy me-1"></i> Copy
          </button>
        </div>

        <a href="#" id="testLink" target="_blank" class="btn btn-outline-success w-100">
          <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Test Link
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Libraries -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- External Custom JS File -->
<script src="/js/generate_link.js"></script>
</body>
</html>
