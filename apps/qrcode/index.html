<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive QR Code Generator | nodexGo</title>
    <!-- Load FontAwesome and Tailwind -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandBlue: '#3b82f6',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <a href="/user/dashboard" class="flex items-center text-xl font-bold text-blue-600 tracking-wide hover:opacity-90 transition duration-150">
            <i class="fa-solid fa-server mr-2"></i>nodex<span class="text-slate-800 font-semibold">Go</span>
        </a>
        <a href="/user/dashboard" class="text-xs font-semibold bg-blue-50 text-blue-600 px-4 py-2 rounded-full border border-blue-200 hover:bg-blue-100 transition duration-150">
            <i class="fa-solid fa-arrow-left mr-1"></i> Return Dashboard
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white border border-gray-200 shadow-xl rounded-2xl p-6 md:p-8 max-w-md w-full text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-100 text-blue-600 rounded-full mb-4">
                <i class="fa-solid fa-qrcode text-2xl"></i>
            </div>
            <h1 class="text-xl md:text-2xl font-bold text-gray-800 mb-2">QR Code Generator</h1>
            <p class="text-xs text-gray-500 mb-6">Create instantly downloadable QR codes for URLs, text, or contacts.</p>

            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">QR Content / Target Link</label>
                    <input type="text" id="qrText" class="w-full text-sm rounded-md px-3.5 py-2.5 border border-gray-200 focus:outline-none focus:border-blue-500" placeholder="https://example.com" value="https://nodexplatform.com.ng" />
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Sizing Dimension</label>
                    <select id="qrSize" class="w-full text-sm rounded-md px-3.5 py-2.5 border border-gray-200 focus:outline-none focus:border-blue-500">
                        <option value="150x150">150 x 150 px</option>
                        <option value="250x250" selected>250 x 250 px</option>
                        <option value="350x350">350 x 350 px</option>
                    </select>
                </div>

                <button id="btnGenerate" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-3 px-6 rounded-xl shadow-lg transition duration-150 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generate QR Code
                </button>
            </div>

            <!-- Result Box -->
            <div id="qrResult" class="hidden mt-6 p-4 border border-gray-100 rounded-xl bg-slate-50 flex flex-col items-center">
                <img id="qrImage" src="" alt="QR Code" class="border border-gray-200 rounded-lg p-2 bg-white" />
                <a id="btnDownload" href="#" target="_blank" class="mt-4 text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-full flex items-center gap-1.5 transition duration-150 shadow-md">
                    <i class="fa-solid fa-download"></i> Download QR Image
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 py-3 text-center text-2xs text-gray-400">
        &copy; 2026 nodexGo. Secure QR Generation Utility.
    </footer>

    <script>
        document.getElementById('btnGenerate').addEventListener('click', function() {
            const text = document.getElementById('qrText').value.trim();
            const size = document.getElementById('qrSize').value;
            if (!text) {
                alert('Please provide some content/link.');
                return;
            }
            const encodedText = encodeURIComponent(text);
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}&data=${encodedText}`;

            const qrImage = document.getElementById('qrImage');
            qrImage.src = qrUrl;

            document.getElementById('btnDownload').href = qrUrl;
            document.getElementById('qrResult').classList.remove('hidden');
        });
    </script>
</body>
</html>
