<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/invoice_gen.css">
</head>
<body>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold m-0"><i class="fa-solid fa-file-invoice-dollar text-primary me-2"></i> Small Business Invoice Generator</h2>
    <div>
      <button type="button" id="saveBtn" class="btn btn-outline-primary me-2">
        <i class="fa-solid fa-cloud-arrow-up me-1"></i> Save Invoice
      </button>
      <button type="button" id="downloadPdfBtn" class="btn btn-success">
        <i class="fa-solid fa-file-pdf me-1"></i> Download PDF
      </button>
    </div>
  </div>

  <!-- Main Invoice Card (PDF Printable Canvas) -->
  <div class="card shadow-sm border-0 rounded-3 p-4 p-md-5" id="invoicePaper">

    <!-- Header: Business Info & Logo Upload -->
    <div class="row mb-4 align-items-start">
      <div class="col-md-6 mb-3 mb-md-0">
        <div class="logo-upload-wrapper mb-3">
          <img id="logoPreview" src="https://via.placeholder.com/180x70?text=Upload+Logo" alt="Company Logo" class="img-fluid rounded border cursor-pointer">
          <input type="file" id="logoInput" accept="image/*" class="d-none">
        </div>
        <input type="text" id="businessName" class="form-control form-control-lg fw-bold border-0 px-0" placeholder="Your Business Name">
        <input type="text" id="businessDetails" class="form-control form-control-sm border-0 px-0 text-muted" placeholder="Address, Phone, Email, Tax ID">
      </div>
      <div class="col-md-6 text-md-end">
        <h1 class="text-uppercase text-secondary fw-bold display-6 mb-3">INVOICE</h1>
        <div class="row g-2 justify-content-md-end">
          <div class="col-6 col-md-5">
            <label class="small text-muted fw-semibold">Invoice #</label>
            <input type="text" id="invoiceNum" class="form-control form-control-sm text-md-end" value="INV-1001">
          </div>
          <div class="col-6 col-md-5">
            <label class="small text-muted fw-semibold">Date</label>
            <input type="date" id="invoiceDate" class="form-control form-control-sm text-md-end">
          </div>
          <div class="col-6 col-md-5">
            <label class="small text-muted fw-semibold">Due Date</label>
            <input type="date" id="dueDate" class="form-control form-control-sm text-md-end">
          </div>
          <div class="col-6 col-md-5">
            <label class="small text-muted fw-semibold">Status</label>
            <select id="paymentStatus" class="form-select form-select-sm text-md-end fw-bold text-warning">
              <option value="Unpaid" class="text-warning">Unpaid</option>
              <option value="Paid" class="text-success">Paid</option>
              <option value="Overdue" class="text-danger">Overdue</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <hr class="my-4">

    <!-- Customer Database Dropdown & Bill To Section -->
    <div class="row mb-4">
      <div class="col-md-6">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="fw-bold text-uppercase small text-muted">Billed To:</label>
          <select id="customerSelect" class="form-select form-select-sm w-auto">
            <option value="">-- Select Saved Customer --</option>
          </select>
        </div>
        <input type="text" id="clientName" class="form-control fw-semibold mb-1" placeholder="Client / Company Name">
        <textarea id="clientDetails" class="form-control form-control-sm text-muted" rows="3" placeholder="Client Address, Email, Phone"></textarea>
      </div>
    </div>

    <!-- Line Items Table -->
    <div class="table-responsive mb-4">
      <table class="table align-middle" id="itemsTable">
        <thead class="table-light">
          <tr>
            <th style="width: 45%;">Item Description</th>
            <th style="width: 15%;" class="text-center">Quantity</th>
            <th style="width: 20%;" class="text-end">Rate ($)</th>
            <th style="width: 15%;" class="text-end">Amount ($)</th>
            <th style="width: 5%;" class="text-center no-print"></th>
          </tr>
        </thead>
        <tbody id="itemsBody">
          <!-- Dynamic line item rows added via jQuery -->
        </tbody>
      </table>
      <button type="button" id="addItemBtn" class="btn btn-sm btn-outline-primary no-print">
        <i class="fa-solid fa-plus me-1"></i> Add Line Item
      </button>
    </div>

    <!-- Summary & Notes -->
    <div class="row pt-3">
      <div class="col-md-6 mb-3 mb-md-0">
        <label class="fw-semibold small text-muted">Payment Instructions / Notes:</label>
        <textarea id="invoiceNotes" class="form-control form-control-sm" rows="4" placeholder="Bank details, Payment terms, or Thank you message..."></textarea>
      </div>
      <div class="col-md-5 offset-md-1">
        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted">Subtotal:</span>
          <span class="fw-semibold" id="subtotalVal">$0.00</span>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="text-muted">Tax (%):</span>
          <input type="number" id="taxInput" class="form-control form-control-sm w-25 text-end" value="10" min="0" step="0.5">
        </div>
        <hr>
        <div class="d-flex justify-content-between align-items-center fs-5 fw-bold">
          <span>Total Due:</span>
          <span class="text-primary" id="totalVal">$0.00</span>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Libraries: jQuery, Bootstrap, html2pdf.js -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- Custom JS -->
<script src="/js/invoice_gen.js"></script>
</body>
</html>
