[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickchat"
version = "1.0.0"
description = "QuickChat Next-Generation Social Media, Messaging, Creator Economy and Professional Networking Platform"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
