<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Custom title for custom-tenant.com domain -->
    <title>Independent Ventures | Custom Site</title>
    <style>
        /* High-quality dark styling for custom tenant domain */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #121214;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e24;
            border: 1px solid #2e2e38;
            border-radius: 16px;
            padding: 3rem;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: #e67e22;
            margin-top: 0;
        }
        p {
            font-size: 1.15rem;
            color: #9ca3af;
            line-height: 1.7;
        }
        .highlight {
            color: #e67e22;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Main content container -->
    <div class="container">
        <h1>Independent Ventures</h1>
        <!-- Detail file resolution mechanics -->
        <p>Welcome to our custom tenant portal. This static resource is served directly from the <code>/public/custom-tenant.com/index.html</code> directory.</p>
        <p>Every other custom tenant website operates securely in its own public folder, powered by <span class="highlight">nodexplatform.com.ng</span>.</p>
    </div>
</body>
</html>
