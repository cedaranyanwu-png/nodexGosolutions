<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Billing | nodexGosolutions</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><radialGradient id="g" cx="50%25" cy="50%25" r="50%25"><stop offset="0%25" stop-color="%2306b6d4"/><stop offset="100%25" stop-color="%236366f1"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(%23g)"/><path d="M18 44V20l14 24V20M38 20h8v24M38 32h8" stroke="%23fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>' />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://nodexplatform.com.ng/billing-mobile.css" />
</head>
<body>

  <!-- Top Nav (Injected by nav-dash-mobile.js) -->
  <header id="topnav-container"></header>

  <main class="main-content">

    <!-- Welcome -->
    <div class="welcome-section">
      <h1>Billing 💳</h1>
      <p>Payments & transfers</p>
    </div>

    <!-- Balance Card (Mobile Compact) -->
    <div class="balance-card-mobile">
      <div class="balance-row">
        <div class="balance-item">
          <span class="balance-label">Paid</span>
          <span class="balance-value" id="totalPaid">₦0</span>
        </div>
        <div class="balance-divider"></div>
        <div class="balance-item">
          <span class="balance-label">Pending</span>
          <span class="balance-value" id="totalPending">₦0</span>
        </div>
        <div class="balance-divider"></div>
        <div class="balance-item">
          <span class="balance-label">Next</span>
          <span class="balance-value" id="nextPayment">₦0</span>
        </div>
      </div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="quick-pay-actions">
      <button class="quick-pay-btn" data-amount="5000">₦5k</button>
      <button class="quick-pay-btn" data-amount="10000">₦10k</button>
      <button class="quick-pay-btn" data-amount="15000">₦15k</button>
      <button class="quick-pay-btn" data-amount="50000">₦50k</button>
      <button class="quick-pay-btn" data-amount="100000">₦100k</button>
    </div>

    <!-- Tabs (Mobile) -->
    <div class="tabs-mobile">
      <button class="tab-mobile active" data-tab="pay">💳 Pay</button>
      <button class="tab-mobile" data-tab="history">📊 History</button>
      <button class="tab-mobile admin-only" data-tab="transfer" style="display:none;">💸 Send</button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content">

      <!-- PAY TAB -->
      <div class="tab-pane-mobile active" id="tab-pay">
        <div class="card">
          <div class="card-header">
            <h3>Make Payment</h3>
          </div>
          <form id="paymentForm" class="form">
            <div class="form-group">
              <label>Amount (₦)</label>
              <input type="number" id="payAmount" min="100" step="1" placeholder="Enter amount" required inputmode="numeric" />
              <span class="error-msg" id="payAmountError"></span>
            </div>
            <div class="form-group">
              <label>Purpose</label>
              <select id="payDescription" required>
                <option value="">Select purpose</option>
                <option value="Hosting - Basic Plan">Hosting - Basic</option>
                <option value="Hosting - Business Plan">Hosting - Business</option>
                <option value="Hosting - Enterprise Plan">Hosting - Enterprise</option>
                <option value="Web Development Service">Web Development</option>
                <option value="Hotel Management System">Hotel System</option>
                <option value="Space Science Solutions">Space Science</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="payment-summary-mobile">
              <div class="summary-row">
                <span>Total:</span>
                <span id="summaryTotal" class="summary-total">₦0.00</span>
              </div>
            </div>
            <button type="submit" class="btn-submit" id="payBtn">
              <span class="btn-text">Pay Now</span>
              <span class="btn-loader" style="display:none;">Processing...</span>
            </button>
          </form>
        </div>

        <div class="security-notice-mobile">
          <span>🔒</span>
          <p>Secured by Flutterwave. Encrypted & safe.</p>
        </div>
      </div>

      <!-- HISTORY TAB -->
      <div class="tab-pane-mobile" id="tab-history">
        <div class="card">
          <div class="card-header">
            <h3>Transactions</h3>
            <button class="action-btn small" id="refreshHistoryBtn">🔄</button>
          </div>
          <div class="transaction-list" id="historyList">
            <p style="color: var(--muted); text-align: center; padding: 1rem;">Loading...</p>
          </div>
        </div>
      </div>

      <!-- TRANSFER TAB (Admin Only) -->
      <div class="tab-pane-mobile" id="tab-transfer">
        <div class="card">
          <div class="card-header">
            <h3>Send Money</h3>
          </div>
          <form id="transferForm" class="form">
            <div class="form-group">
              <label>Bank</label>
              <select id="transferBank" required>
                <option value="">Select bank</option>
              </select>
            </div>
            <div class="form-group">
              <label>Account Number</label>
              <input type="tel" id="transferAccount" maxlength="10" placeholder="10 digits" required inputmode="numeric" />
            </div>
            <div class="form-group">
              <label>Account Name</label>
              <input type="text" id="transferAccountName" placeholder="Auto-fill" readonly />
              <button type="button" class="btn-link" id="resolveAccountBtn">Resolve Account</button>
            </div>
            <div class="form-group">
              <label>Amount (₦)</label>
              <input type="number" id="transferAmount" min="100" placeholder="Amount" required inputmode="numeric" />
            </div>
            <div class="form-group">
              <label>Narration</label>
              <input type="text" id="transferNarration" placeholder="Description" />
            </div>
            <button type="submit" class="btn-submit" id="transferBtn">
              <span class="btn-text">Send Transfer</span>
              <span class="btn-loader" style="display:none;">Sending...</span>
            </button>
          </form>
        </div>
      </div>

    </div>

  </main>

  <!-- Bottom Nav (Injected by nav-dash-mobile.js) -->
  <nav id="bottomnav-container"></nav>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="https://nodexplatform.com.ng/session-mobile.js"></script>
  <script src="https://nodexplatform.com.ng/nav-dash-mobile.js"></script>
  <script src="https://nodexplatform.com.ng/billing-mobile.js"></script>
</body>
</html>
