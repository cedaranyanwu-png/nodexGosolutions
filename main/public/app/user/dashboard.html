<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodex App Hosting Dashboard</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Mobile Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-6" href="#"><i class="fa-solid fa-mobile-screen me-2"></i>Nodex Mobile Hub</a>
            <button class="btn btn-outline-light btn-sm" onclick="logoutAppUser()">Logout</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-3">
        <!-- Overview Widgets -->
        <div class="row g-3 mb-3">
            <div class="col-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-3">
                        <small class="text-muted">Active Apps</small>
                        <h4 id="appWidgetAppsCount" class="fw-bold mb-0">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-3">
                        <small class="text-muted">Balance</small>
                        <h4 id="appWidgetBalance" class="fw-bold text-success mb-0">₦0.00</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- App Deployment Section -->
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-header bg-white">
                <h6 class="mb-0 fw-bold"><i class="fa-solid fa-rocket me-2 text-primary"></i>Quick App Deploy</h6>
            </div>
            <div class="card-body">
                <form id="appDeployForm">
                    <div class="mb-2">
                        <label class="form-label small">App Name</label>
                        <input type="text" class="form-control form-control-sm" id="appAppName" required placeholder="myapp">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Subdomain</label>
                        <input type="text" class="form-control form-control-sm" id="appSubdomain" required placeholder="myapp">
                    </div>
                    <button type="submit" class="btn btn-dark btn-sm w-100">Deploy Now</button>
                </form>
            </div>
        </div>

        <!-- File System Section -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h6 class="mb-0 fw-bold"><i class="fa-solid fa-folder-open me-2 text-warning"></i>Files</h6>
                <button class="btn btn-xs btn-primary py-0 px-2" style="font-size: 12px;" onclick="loadAppFiles()">Refresh</button>
            </div>
            <div class="card-body p-0">
                <ul class="list-group list-group-flush" id="appFileList">
                    <li class="list-group-item text-muted text-center small py-3">Loading files...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://checkout.flutterwave.com/v3.js"></script>

    <script src="/js/session.js"></script>
    <script src="/js/app-dashboard.js"></script>
</body>
</html>
