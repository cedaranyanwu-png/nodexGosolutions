<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Verify Email | nodexGosolutions</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><radialGradient id="g" cx="50%25" cy="50%25" r="50%25"><stop offset="0%25" stop-color="%2306b6d4"/><stop offset="100%25" stop-color="%236366f1"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(%23g)"/></svg>' />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://nodexplatform.com.ng/main/css/verify-mobile.css" />
  <link rel="stylesheet" href="https://nodexplatform.com.ng/main/css/styles.css" />
</head>
<body>
  <div id="nav-container"></div>

  <main class="verify-container">
    <div class="verify-card">

      <div id="loadingState" class="verify-state">
        <div class="verify-icon loading">
          <div class="spinner"></div>
        </div>
        <h1>Verifying Your Email</h1>
        <p>Please wait...</p>
      </div>

      <div id="successState" class="verify-state" style="display:none;">
        <div class="verify-icon success">✓</div>
        <h1>Email Verified!</h1>
        <p>Your email has been verified. You can now login.</p>
        <a href="login.html" class="btn-primary">Continue to Login</a>
      </div>

      <div id="errorState" class="verify-state" style="display:none;">
        <div class="verify-icon error">✗</div>
        <h1 id="errorTitle">Verification Failed</h1>
        <p id="errorMessage">Something went wrong.</p>

        <div class="resend-form">
          <p>Need a new link?</p>
          <form id="resendForm">
            <input type="email" id="resendEmail" placeholder="Your email" required inputmode="email" />
            <button type="submit" class="btn-primary" id="resendBtn">
              <span class="btn-text">Resend Email</span>
              <span class="btn-loader" style="display:none;">Sending...</span>
            </button>
          </form>
        </div>

        <a href="login.html" class="back-link">Back to Login</a>
      </div>

      <div id="alreadyVerifiedState" class="verify-state" style="display:none;">
        <div class="verify-icon success">✓</div>
        <h1>Already Verified!</h1>
        <p>Your email is already verified.</p>
        <a href="login.html" class="btn-primary">Continue to Login</a>
      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://nodexplatform.com.ng/main/js/nav.js"></script>
  <script src="https://nodexplatform.com.ng/main/js/verify.js"></script>
  <script src="https://nodexplatform.com.ng/main/js/footer.js"></script>
</body>
</html>
