<!-- Three.js 3D Background Canvas overlay and initialization script for public screens -->
<div id="nx-3d-canvas-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; overflow: hidden; opacity: 0.65;">
    <canvas id="nx-3d-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
    if (typeof THREE === 'undefined') return;

    const canvas = document.getElementById('nx-3d-canvas');
    if (!canvas) return;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 120;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: window.innerWidth > 768 });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Dynamic 3D Particle Grid Node
    const particleCount = window.innerWidth < 768 ? 90 : 220;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const colorPrimary = new THREE.Color(0x0072ff);
    const colorCyan = new THREE.Color(0x00d2ff);

    for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 280;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 280;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 180;

        const mixedColor = colorPrimary.clone().lerp(colorCyan, Math.random());
        colors[i * 3] = mixedColor.r;
        colors[i * 3 + 1] = mixedColor.g;
        colors[i * 3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: window.innerWidth < 768 ? 2.5 : 3.5,
        vertexColors: true,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // 3D Geometric Torus Ring
    const ringGeo = new THREE.TorusGeometry(35, 0.4, 16, window.innerWidth < 768 ? 32 : 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x0072ff, wireframe: true, transparent: true, opacity: 0.25 });
    const torusRing = new THREE.Mesh(ringGeo, ringMat);
    scene.add(torusRing);

    let mouseX = 0, mouseY = 0;
    const handleMove = (e) => {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        mouseX = (clientX - window.innerWidth / 2) * 0.05;
        mouseY = (clientY - window.innerHeight / 2) * 0.05;
    };

    window.addEventListener('mousemove', handleMove, { passive: true });
    window.addEventListener('touchmove', handleMove, { passive: true });

    let animationFrameId;
    function animate() {
        animationFrameId = requestAnimationFrame(animate);

        particles.rotation.x += 0.0006;
        particles.rotation.y += 0.0008;

        torusRing.rotation.x += 0.003;
        torusRing.rotation.y += 0.004;

        camera.position.x += (mouseX - camera.position.x) * 0.03;
        camera.position.y += (-mouseY - camera.position.y) * 0.03;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
})();
</script>
