<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Teammate - NodexPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="/static/css/animations.css" rel="stylesheet">
    <style>
        .workspace-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .role-card { cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .role-card:hover { border-color: #0d6efd; transform: translateY(-2px); }
        .role-card.active { border-color: #0d6efd; background-color: #f8f9ff; }
    </style>
    <link rel="stylesheet" href="/static/css/nodex.css">
</head>
<body class="protected-page">

    {% include "modul/user_nav.html" %}

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 fade-in-up">

                <div class="mb-4">
                    <h2 class="fw-bold"><i class="bi bi-person-plus-fill text-primary me-2"></i>Add New Teammate</h2>
                    <p class="text-muted">Invite a colleague to your workspace and assign them a specific role.</p>
                </div>

                <div class="card workspace-card p-4">
                    <form id="addWorkerForm">
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label fw-bold">First Name</label>
                                <input type="text" class="form-control" id="workerFirstName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Last Name</label>
                                <input type="text" class="form-control" id="workerLastName" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="workerEmail" placeholder="colleague@company.com" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold mb-3">Select Role</label>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <div class="card role-card p-3 text-center active" data-role="admin">
                                        <i class="bi bi-shield-lock-fill fs-2 text-danger mb-2"></i>
                                        <h6 class="fw-bold mb-1">Admin</h6>
                                        <small class="text-muted">Full access</small>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="card role-card p-3 text-center" data-role="worker">
                                        <i class="bi bi-tools fs-2 text-primary mb-2"></i>
                                        <h6 class="fw-bold mb-1">Worker</h6>
                                        <small class="text-muted">Edit & Build</small>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="card role-card p-3 text-center" data-role="viewer">
                                        <i class="bi bi-eye-fill fs-2 text-secondary mb-2"></i>
                                        <h6 class="fw-bold mb-1">Viewer</h6>
                                        <small class="text-muted">Read only</small>
                                    </div>
                                </div>
                            </div>
                            <input type="hidden" id="selectedRole" value="admin">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Permissions (Optional)</label>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="permDeploy" checked>
                                        <label class="form-check-label" for="permDeploy">Can deploy applications</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="permBilling">
                                        <label class="form-check-label" for="permBilling">Can manage billing</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="permInvite" checked>
                                        <label class="form-check-label" for="permInvite">Can invite new members</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="permClient">
                                        <label class="form-check-label" for="permClient">Can interact with clients</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 pt-3 border-top">
                            <button type="submit" class="btn btn-primary px-4 fw-bold">
                                <i class="bi bi-person-plus me-2"></i>Add to Workspace
                            </button>
                            <a href="#" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    {% include "modul/footer.html" %}
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
